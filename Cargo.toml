[workspace]
resolver = "2"
members = [
    "contracts/estamora-payments",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
repository = "https://github.com/Estamora-Soroban-Layers/estamora-contracts"
authors = ["Estamora Contributors"]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
