[package]
name = "estamora-payments"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Policy-guarded milestone escrow and delegated spend-cap payment contract on Stellar"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "27.0.6"

[dev-dependencies]
soroban-sdk = { version = "27.0.6", features = ["testutils"] }
