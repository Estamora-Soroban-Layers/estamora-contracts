name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test & Build Smart Contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Code Formatting
        run: cargo fmt --all --check

      - name: Run Clippy Linter
        run: cargo clippy -p estamora-payments --all-targets -- -A deprecated -A clippy::all

      - name: Run Contract Unit & Integration Tests
        run: cargo test -p estamora-payments --verbose

      - name: Compile Release WASM Contract
        run: cargo build --target wasm32v1-none --release -p estamora-payments

      - name: Verify WASM Size Constraints (< 256KB)
        run: |
          echo "Verifying contract WASM size under Soroban 256KB limit..."
          ls -lh target/wasm32v1-none/release/*.wasm
          for f in target/wasm32v1-none/release/*.wasm; do
            size=$(wc -c < "$f")
            echo "Contract $f: $size bytes"
            if [ "$size" -gt 262144 ]; then
              echo "Error: Contract $f exceeds 256KB cap!"
              exit 1
            fi
          done
          echo "WASM binary verified under network limit."

      - name: Verify Governance & Deploy Assets
        run: |
          test -f LICENSE || (echo "Missing LICENSE" && exit 1)
          test -f deployments/testnet.json || (echo "Missing testnet.json" && exit 1)
          echo "All governance and deployment artifacts present."
