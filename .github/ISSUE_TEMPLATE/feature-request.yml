name: Feature Request
description: Propose a new feature or improvement for estamora-contracts
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest an enhancement or new smart contract functionality for Estamora.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What challenge or payment workflow does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe your proposed smart contract methods or state changes.
    validations:
      required: true
